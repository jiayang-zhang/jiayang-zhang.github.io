name = "biotech-dashboard-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Served from api.jiayangzh.com (zone must be on Cloudflare).
routes = [{ pattern = "api.jiayangzh.com", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://jiayangzh.com"
DATA_MODE = "live"
# Set these three after creating the Cloudflare Access application (see README).
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ADMIN_EMAILS = ""

[[d1_databases]]
binding = "DB"
database_name = "biotech"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
# UTC. The price job covers 09:30-16:00 New York in both DST states and skips
# itself outside the session, apart from one run after the close.
crons = ["*/5 13-21 * * 1-5", "7 12 * * 1-5"]

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
